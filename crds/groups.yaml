apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: groups.a5e.k8s.rocks
spec:
  group: a5e.k8s.rocks
  scope: Cluster
  names:
    kind: Group
    listKind: GroupList
    plural: groups
    singular: group
    shortNames:
      - group
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      namespaces:
                        type: array
                        items:
                          type: string
                        default: []
                      labelSelector:
                        type: object
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                operator:
                                  type: string
                                  enum:
                                    - In
                                    - NotIn
                                    - Exists
                                    - DoesNotExist
                                values:
                                  type: array
                                  items:
                                    type: string
                              required:
                                - key
                                - operator
                      actions:
                        type: array
                        items:
                          type: string
                        minItems: 1
                    required:
                      - type
                      - actions
                  default: []
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
