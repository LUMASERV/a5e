apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusteransiblesshkeys.a5e.k8s.rocks
spec:
  group: a5e.k8s.rocks
  scope: Cluster
  names:
    kind: ClusterAnsibleSSHKey
    listKind: ClusterAnsibleSSHKeyList
    plural: clusteransiblesshkeys
    singular: clusteransiblesshkey
    shortNames:
      - cansiblesshkey
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: KeyType
          jsonPath: .status.keyType
          type: string
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - namespace
                passphraseSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - namespace
              required:
                - secretRef
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                publicKey:
                  type: string
                fingerprint:
                  type: string
                keyType:
                  type: string
                  enum:
                    - rsa
                    - ed25519
                    - ecdsa
