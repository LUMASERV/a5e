apiVersion: v1
kind: ServiceAccount
metadata:
  name: a5e-api
  namespace: a5e-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: a5e-api
rules:
  # The API's own ServiceAccount now holds direct, broad CRUD on every CRD kind — the custom
  # in-app permission engine (auth/permission-engine.ts), not k8s RBAC/impersonation, decides
  # every allow/deny (see the plan's "fully replace RBAC" decision). Every CRUD call goes out as
  # this identity ('self'), never impersonating a logged-in user, so no `impersonate` verb grant
  # is needed at all any more.
  - apiGroups: ["a5e.k8s.rocks"]
    resources:
      - ansiblehosts
      - clusteransiblehosts
      - ansibleinventories
      - clusteransibleinventories
      - ansibleplaybooks
      - clusteransibleplaybooks
      - ansiblesshkeys
      - clusteransiblesshkeys
      - ansibleruns
      - ansiblejobs
      - changerequests
      - groups
      - users
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["a5e.k8s.rocks"]
    resources:
      - ansiblehosts/status
      - clusteransiblehosts/status
      - ansibleinventories/status
      - clusteransibleinventories/status
      - ansibleplaybooks/status
      - clusteransibleplaybooks/status
      - ansiblesshkeys/status
      - clusteransiblesshkeys/status
      - ansibleruns/status
      - ansiblejobs/status
      - changerequests/status
      - groups/status
      - users/status
    verbs: ["get", "update", "patch"]
  # Populates the UI's namespace picker (modules/ancillary.ts) — not gated by the permission
  # engine, since it's only ever used to list namespaces to pick from, not to decide what
  # resource operations are allowed within one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  # Live log streaming/download (modules/ansibleruns.ts, via @a5e/k8s-client's streamPodLog and
  # the direct coreApi.readNamespacedPodLog call) now runs as this identity too, gated by the
  # caller's `get` grant on the AnsibleRun itself rather than by RBAC on the Pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # modules/sshkey-import.ts creates the backing Secret for a generated/uploaded SSH key as this
  # identity too, cluster-wide since a ClusterAnsibleSSHKey's target namespace can be any
  # namespace — no broad `get` granted, the API only ever writes a Secret it itself names at
  # import time, never reads an arbitrary one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: a5e-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: a5e-api
subjects:
  - kind: ServiceAccount
    name: a5e-api
    namespace: a5e-system
---
# Namespaced Role (not a ClusterRole) so this stays confined to the API's own namespace: OIDC
# config and local-account password hashes are the only two things still user-editable at runtime
# (Settings page) that live in a Secret rather than a CRD — see lib/oidc-config-store.ts,
# auth/user-passwords.ts. Everything else (identity/role/permissions metadata, groups) moved to
# the `User`/`Group` CRDs, already covered by the broad a5e.k8s.rocks CRD rules above.
# `resourceNames` scopes get/update/patch to exactly these Secrets, but Kubernetes RBAC does NOT
# apply `resourceNames` to `create` (there's no existing object to name-check yet) — the namespace
# boundary is what actually limits blast radius for that verb, not the resourceNames list.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: a5e-api-oidc-config
  namespace: a5e-system
rules:
  # a5e-user-passwords: the only place a password hash ever lives (auth/user-passwords.ts) — the
  # identity/authorization metadata it belongs to (username, role, permissions, ...) is a real
  # `User` CRD now, not a Secret, already covered by the broad a5e.k8s.rocks CRD rules above; only
  # the credential material itself stays here, narrowly scoped by name.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["a5e-oidc-config", "a5e-user-passwords"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # a5e-local-accounts / a5e-oidc-user-roles: the pre-User-CRD accounts store (auth/
  # migrate-legacy-users.ts), from any install that predates this change. get+delete only — an
  # upgraded API reads it once at startup to migrate every account into a `User` CR, then deletes
  # it; nothing ever writes to it again. A from-scratch install never creates these, so a fresh
  # deployment just gets a permission it never exercises.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["a5e-local-accounts"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["a5e-oidc-user-roles"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: a5e-api-oidc-config
  namespace: a5e-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: a5e-api-oidc-config
subjects:
  - kind: ServiceAccount
    name: a5e-api
    namespace: a5e-system
