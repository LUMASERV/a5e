name: Release images

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: registry.lumaserv.dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: operator
            context: packages/operator
          - image: api
            context: packages/api
          - image: ui
            context: packages/ui
          - image: runner
            context: packages/runner-image
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Requires REGISTRY_USERNAME/REGISTRY_PASSWORD secrets configured in the repo's
          # Settings → Secrets and variables → Actions — this is an internal LUMASERV registry,
          # not GHCR, so there's no built-in GITHUB_TOKEN credential for it.
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/public/a5e/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/public/a5e/${{ matrix.image }}:latest
