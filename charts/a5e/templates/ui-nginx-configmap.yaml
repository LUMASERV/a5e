apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "a5e.uiName" . }}-nginx
  namespace: {{ include "a5e.namespace" . }}
  labels:
    {{- include "a5e.componentLabels" (list . "ui") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "a5e.apiName" . }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off; # needed for SSE (watch/logs streams)
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
